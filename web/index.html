<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1E7A4C" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D1512" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Домашно — разписание и домашни за класа" />
    <meta property="og:description" content="Импортирай разписанието от Shkolo PDF, а класът добавя домашни със снимки, PDF и презентации." />
    <meta property="og:image" content="/branding/social-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Домашно — разписание и домашни за класа" />
    <meta name="twitter:image" content="/branding/social-preview.png" />
    <meta
      name="description"
      content="Домашно — разписание и домашни за класа. Импортирай разписанието от Shkolo PDF, а класът добавя домашни със снимки, PDF и презентации."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="ai-catalog" href="/.well-known/ai-catalog.json" />
    <link rel="preconnect" href="https://challenges.cloudflare.com" />
    <!-- Self-hosted Golos Text (see src/fonts.css): preload the Cyrillic
         face used above the fold so first paint rarely needs a font swap.
         (One file serves all weights, same as Google's css2 response.) -->
    <link rel="preload" href="/fonts/golos-text-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <title>Домашно</title>
    <script>
      // Set the theme before first paint to avoid a flash.
      (function () {
        try {
          var pref = localStorage.getItem('domashno-theme') || 'system';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
